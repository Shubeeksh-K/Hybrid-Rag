[project]
name = "qft-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.2",
    "faiss-cpu>=1.15.1",
    "numpy>=2.5.4",
    "sentence-transformers<6",
    "tiktoken>=0.14.0",
    "transformers<5",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
